      const key = `${kind}|${id}`;
      if (_prefetchCache.has(key)) return;
      _prefetchCache.set(key, true);
      try {
        const res = await fetchMd(kind, id);
        _prefetchCache.set(key, res);
      } catch (e) {
        _prefetchCache.set(key, { error: String(e) });
      }
    }

    // -----------------------------------------------------------
    // Events
    // -----------------------------------------------------------
    document.querySelectorAll('#side-tabs .side-tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('#side-tabs .side-tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        state.kind = t.dataset.kind;
        // 切 tab 时尝试保留同 id 选中
        if (state.selectedId && state.selectedId.kind !== state.kind) {
          state.selectedId = null;
        }
        // 提交人筛选重置为「全部」并按新 Tab 重建选项
        state.author = '';
        rebuildAuthorOptions();
        renderSidebar();
        renderPreviewMeta();
      });
    });

    document.querySelectorAll('#preview-tabs .preview-tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('#preview-tabs .preview-tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        state.pane = t.dataset.pane;
        renderPreviewBody();
      });
    });

    document.getElementById('search').addEventListener('input', (e) => {
      state.query = e.target.value || '';
      renderSidebar();
    });

    document.getElementById('author-filter').addEventListener('change', (e) => {
      state.author = e.target.value || '';
      renderSidebar();
    });

    // 复选工具条：全选（当前筛选结果）/ 清空 / 导出 CSV
    document.getElementById('sel-all').addEventListener('change', (e) => {
      const bucket = state.checked[state.kind];
      (state._filtered || []).forEach(it => {
        const id = itemLabel(it, state.kind);
        if (e.target.checked) bucket.add(id); else bucket.delete(id);
      });
      renderSidebar();
    });
    document.getElementById('sel-none').addEventListener('click', () => {
      state.checked[state.kind].clear();
      renderSidebar();
    });
    document.getElementById('btn-export-csv').addEventListener('click', exportCheckedCsv);

    // 「对比勾选」：把勾选的因子作为子集切到评级榜并触发批量计算
    document.getElementById('btn-compare-lb').addEventListener('click', () => {
      const ids = [...state.checked.factors];
      if (!ids.length) return;
      state.leaderboard.subset = ids;
      state.kind = 'leaderboard';
      document.querySelectorAll('#side-tabs .side-tab').forEach(x => x.classList.toggle('active', x.dataset.kind === 'leaderboard'));
      state.selectedId = null;
      renderSidebar();
      renderPreviewMeta();
      lbComputeAll();  // subset 模式下只计算勾选的因子
    });

    // 侧栏宽度拖拽
    (function initSplitter() {
      const app = document.querySelector('.app');
      const splitter = document.getElementById('splitter');
      let dragging = false;
      splitter.addEventListener('mousedown', () => { dragging = true; document.body.style.cursor = 'col-resize'; });
      window.addEventListener('mouseup',   () => { dragging = false; document.body.style.cursor = ''; });
      window.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        const w = Math.max(380, Math.min(760, e.clientX));
        app.style.gridTemplateColumns = `${w}px 6px 1fr`;
      });
    })();

    // -----------------------------------------------------------
    // Util
    // -----------------------------------------------------------
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function escapeAttr(s) { return escapeHtml(s); }

    // -----------------------------------------------------------
    // Boot
    // -----------------------------------------------------------
    async function reload() {
      try {
        const data = await fetchOverview();
        state.items.factors       = data.factors       || [];
        state.items.strategies    = data.strategies    || [];
        state.items.pystrategies  = data.pystrategies  || [];
        // 勾选项随数据刷新剪枝：已消失的条目从勾选集中移除
        ['factors', 'strategies', 'pystrategies'].forEach(k => {
          const alive = new Set(state.items[k].map(it => itemLabel(it, k)));
          state.checked[k].forEach(id => { if (!alive.has(id)) state.checked[k].delete(id); });
        });
        rebuildAuthorOptions();
        renderSidebar();
        // 因子检查状态批量拉取（失败静默降级，不阻塞列表）
        refreshCheckStatus();
        // 选中恢复
        if (state.selectedId && state.selectedId.kind === state.kind) {
          const exists = (state.items[state.kind] || []).some(it => itemLabel(it, state.kind) === state.selectedId.id);
          if (!exists) state.selectedId = null;
        }
        renderPreviewMeta();
      } catch (e) {
        document.getElementById('side-list').innerHTML = `<div class="side-empty" style="color:var(--down)">加载失败: ${escapeHtml(String(e))}<br><br>请确认后端已启动，且 <code>/api/admin/overview</code> 可访问</div>`;
      }
    }

    // 头顶时间对照：UTC 与 SIN(+8)，秒级刷新
    function tickClocks() {
      const pad = (n) => String(n).padStart(2, '0');
      const fmt = (d) => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
      const now = Date.now();
      document.getElementById('clock-utc').textContent = fmt(new Date(now));
      document.getElementById('clock-sin').textContent = fmt(new Date(now + 8 * 3600 * 1000));
    }
    tickClocks();
    setInterval(tickClocks, 1000);

    reload();
    setInterval(reload, 30000);  // 30s 增量刷新以反映热插拔
  </script>
</body>
</html>
