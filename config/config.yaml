# Standalone deliverable configuration for run_evaluation.py.
run_date: auto

runtime:
  random_seed: 42

experiment:
  experiment_id: default
  in_sample:
    start: null
    end: null
  out_of_sample:
    start: null
    end: null
  fail_fast_on_hash_change: false

input:
  # Preferred two-file contract: factor generation never writes forward returns,
  # while the evaluation panel owns timing metadata and return labels.
  factor_panel_path: outputs/factors/factor_panel.csv
  evaluation_panel_path: data/evaluation_panel.csv
  # Optional backward-compatible already-merged panel. Set this path to use it.
  panel_path: null
  generate_demo_if_missing: false
  require_temporal_metadata: true

output:
  root: outputs

evaluation:
  factor_col: factor_value
  return_col: ret_1
  bar_interval: 1d
  layers: 10
  min_assets_per_layer: 1
  min_assets: 5
  sample_start: null
  sample_end: null

universe:
  require_eligibility: true
  eligibility_column: is_eligible

market:
  exchange: binance
  exchange_column: exchange
  market_type: perpetual
  market_column: market_type
  settlement_asset: USDT
  settlement_asset_column: settlement_asset
  allow_short: true
  require_funding_included: true
  funding_included_column: funding_included

preprocessing:
  winsorize_enabled: true
  zscore_enabled: false
  winsorize_limits: [0.01, 0.99]

stability:
  window_days: 60
  min_periods: 20

correlation:
  min_assets: 5

cost:
  fee_bps: 0.0
  slippage_bps: 0.0

regression_guard:
  baseline_path: regression_baseline.json
  thresholds:
    mean_ic: 0.0
    rankic_mean: 0.0
    ic_ir: 0.0
    long_short_ann_return: 0.0
