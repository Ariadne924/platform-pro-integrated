# Factor + strategy configuration
#
# Factors: symbols, providers, parameter overrides.
# Factor code defines required_data, required_symbols, and category
# in the @factor decorator. Config only specifies runtime choices.
#
# Strategies: which factors to combine.

# Research universe — 40 liquid USDⓈ-M perpetual majors, kept in sync with
# data.symbols.perpetual in default.yaml. Referenced by every factor so the
# whole library evaluates on the same cross-section (and validate-report
# derives its fetch plan from it).
