# 因子实例层：工厂因子 + 固定参数预设 → 可命名实例。策略只能引用实例。
# factory 指向 factors 段的工厂因子；params 固化参数；symbols 继承研究池。
factor_instances:
  momentum_20d:
    factory: momentum
    params: {lookback_days: 20}
    symbols: *research_pool
    description: 20 日动量（momentum 默认）
  momentum_60d:
    factory: momentum
    params: {lookback_days: 60}
    symbols: *research_pool
    description: 60 日动量
  momentum_120d:
    factory: momentum
    params: {lookback_days: 120}
    symbols: *research_pool
    description: 120 日动量
  short_term_reversal_5d:
    factory: short_term_reversal
    params: {lookback_days: 5}
    symbols: *research_pool
    description: 5 日反转（short_term_reversal 默认）
  rsi_14:
    factory: rsi
    params: {lookback_days: 14}
    symbols: *research_pool
    description: 14 日 RSI（rsi 默认）
  realized_vol_20d:
    factory: realized_vol
    params: {lookback_days: 20}
    symbols: *research_pool
    description: 20 日已实现波动率（realized_vol 默认）

strategies:
  momentum_long_only:
    used_factors: [momentum_20d]
  equal_weight_combo:
    used_factors: [momentum_20d, short_term_reversal_5d]
  rsi_mean_reversion:
    used_factors: [rsi_14]
  momentum_demo:
    used_factors: [momentum_20d]
  multi_horizon_trend:
    used_factors: [momentum_60d, momentum_120d, realized_vol_20d]
  multi_horizon_trend_long_only:
    used_factors: [momentum_60d, momentum_120d, realized_vol_20d]
  momentum_rotation:
    used_factors: [momentum_60d, momentum_120d, realized_vol_20d]

# Factor groups — named, kind-dispatched factor selectors.
# Each group has a `kind` that decides how its member factors are resolved:
#   kind: list      — explicit list of factor names (`factors:`).
#   kind: category  — all factors in a category (`category:`).
# Unknown/missing factor names are reported but not fatal: the group still
# resolves its registered members, and new kinds can be added as resolvers.
# For big curated sets (e.g. alpha 101/360) list every factor name under
# `factors:` — once the factors are registered the group resolves fully.
factor_groups:
  momentum_study:
    kind: list
    description: 动量与反转（实例）
    factors: [momentum_20d, short_term_reversal_5d, rsi_14]

  crypto_onchain:
    kind: list
    description: MVRV 与已实现价格代理
    factors:
      - binance_mvrv_proxy
      - binance_realized_price_proxy
      - binance_mvrv_proxy_change
      - binance_mvrv_proxy_zscore

  volatility_study:
    kind: category
    description: 波动率分类全部因子
    category: volatility

  # alpha_101:
  #   kind: list
  #   description: WorldQuant Alpha 101 子集
